# Tandevia Gateway on aigateway.forscope.eu (DigitalOcean droplet tandevia-gateway).
#
# The gateway is built from this repository and listens only on the internal
# network; Caddy terminates HTTPS on 80/443 with a Let's Encrypt certificate.
# Secrets live in .env next to this file (see README.md).
services:
  gateway:
    build:
      context: ../..
      dockerfile: transports/Dockerfile
      args:
        VERSION: ${GATEWAY_VERSION:-dev}
        # tsc needs more than Node's default heap on a 2 GB droplet (swap covers the rest).
        NODE_OPTIONS: --max-old-space-size=3072
    image: tandevia/gateway:${GATEWAY_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      LOG_STYLE: json
      GOMEMLIMIT: 1400MiB
    volumes:
      - ./data:/app/data
    # Loopback only: for admin access over `ssh -L 8080:127.0.0.1:8080`.
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2.11.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - gateway
